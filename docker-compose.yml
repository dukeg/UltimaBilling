services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis, mailhog]
    ports: ["8000:8000"]
    volumes: ["./backend/app/storage:/app/app/storage"]
  worker:
    build: ./backend
    env_file: .env
    depends_on: [backend, redis, postgres]
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO
  beat:
    build: ./backend
    env_file: .env
    depends_on: [backend, redis, postgres]
    command: celery -A app.workers.celery_app.celery beat --loglevel=INFO
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  postgres_data:
